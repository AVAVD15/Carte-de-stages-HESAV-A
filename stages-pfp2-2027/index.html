stages.forEach((stage,index)=>stage.index=index);
window.addEventListener('DOMContentLoaded',()=>{
const map=L.map('map',{zoomControl:false,minZoom:5,maxZoom:19,zoomSnap:0.5,zoomDelta:1,touchZoom:true,scrollWheelZoom:true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const cluster=L.markerClusterGroup({maxClusterRadius:60,showCoverageOnHover:false,zoomToBoundsOnClick:true,spiderfyOnMaxZoom:true,spiderfyDistanceMultiplier:1.2}).addTo(map);
const search=document.getElementById('search'),badge=document.getElementById('badge'),inputs=[...document.querySelectorAll('.filters input')],bounds=L.latLngBounds(stages.map(s=>[s.lat,s.lng])),markers=new Map();
function popup(s){
const box=document.createElement('div'),title=document.createElement('strong'),address=document.createElement('div'),heading=document.createElement('b'),list=document.createElement('ul');
title.textContent=s.name;address.textContent=[s.address,s.locality].filter(Boolean).join(', ')||'Adresse non indiquée';box.append(title,address);
if(s.addressNote){const note=document.createElement('div');note.className='address-note';note.textContent=s.addressNote;box.append(note);}
if(s.addressSource){const source=document.createElement('a');source.className='address-source';source.href=s.addressSource;source.target='_blank';source.rel='noopener noreferrer';source.textContent='Source de l’adresse';box.append(source);}
heading.textContent='Points par domaine :';const labels={msq:'MSQ',neuro:'Neuro',cardio:'Cardio-resp',geriatrie:'Gériatrie',autre:'Autre spécialisation',aigu:'Aigu',readapt:'Réadaptation',ambulatoire:'Ambulatoire'};let n=0;
for(const k of Object.keys(labels)){const v=s.points[k]||0;if(v>0){const li=document.createElement('li');li.textContent=labels[k]+' : '+String(v).replace('.',',');list.append(li);n++;}}
box.append(heading);if(n)box.append(list);else{const empty=document.createElement('div');empty.textContent='Aucun point validé dans le tableau.';box.append(empty);}
const meta=document.createElement('small');meta.textContent='Stage '+String(s.index+1).padStart(2,'0')+' sur '+stages.length;box.append(meta);return box;}
stages.forEach(s=>{const icon=L.divIcon({className:'stage-marker',html:'<span class="pin"><span>'+String(s.index+1).padStart(2,'0')+'</span></span>',iconSize:[29,33],iconAnchor:[14,31]});markers.set(s.index,L.marker([s.lat,s.lng],{icon,title:s.name,alt:'Stage '+(s.index+1)+': '+s.name,keyboard:true}).bindPopup(popup(s),{maxWidth:340}));});
function matches(){const q=search.value.trim().toLocaleLowerCase('fr'),selected=inputs.filter(i=>i.checked).map(i=>i.dataset.filter);return stages.filter(s=>selected.every(k=>(s.points[k]||0)>=0.5)&&(!q||(s.name+' '+s.address+' '+s.locality).toLocaleLowerCase('fr').includes(q)));}
function render(){const list=matches();cluster.clearLayers();list.forEach(s=>cluster.addLayer(markers.get(s.index)));badge.textContent=list.length===stages.length?stages.length+' lieux sur la carte':list.length+' / '+stages.length+' lieux';return list;}
function fitAll(){map.fitBounds(bounds,{padding:[48,48],maxZoom:9});}
search.addEventListener('input',()=>{const found=render();if(found.length)map.fitBounds(L.latLngBounds(found.map(s=>[s.lat,s.lng])),{padding:[48,48],maxZoom:12});});inputs.forEach(i=>i.addEventListener('change',render));document.getElementById('zoomIn').addEventListener('click',()=>map.zoomIn());document.getElementById('zoomOut').addEventListener('click',()=>map.zoomOut());document.getElementById('overview').addEventListener('click',fitAll);requestAnimationFrame(()=>requestAnimationFrame(()=>{map.invalidateSize({pan:false});fitAll();render();}));});
</script>
